          nullable: true
        hasNext:
          type: boolean
          description: 다음 페이지 존재 여부
      description: 이벤트 신청 목록 조회 응답
    MyEventResponse:
      required:
      - publicId
      - registrationEndsAt
      - title
      - confirmedCount
      - waitlistCount
      type: object
      properties:
        publicId:
          type: string
        title:
          type: string
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        registrationStartsAt:
          type: string
          format: date-time
          nullable: true
        registrationEndsAt:
          type: string
          format: date-time
        capacity:
          type: integer
          format: int32
          nullable: true
        confirmedCount:
          type: integer
          format: int32
        waitlistCount:
          type: integer
          format: int32
