openapi: 3.0.1
info:
  title: Moiming - Event Schedule Management System API
  description: 모임 일정 관리 시스템 '모이밍' API 문서
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Event
  description: 이벤트 관리 API
- name: Registration
  description: 신청 API
- name: Auth
  description: 인증 API
- name: User
  description: 사용자 API
- name: Image
  description: 이미지 API
paths:
  /api/events/{publicId}:
    get:
      tags:
      - Event
      summary: 이벤트 상세 조회
      description: 이벤트 상세 정보를 조회합니다
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventDetailResponse"
    put:
      tags:
      - Event
      summary: 이벤트 수정
      description: 이벤트를 수정합니다
      security:
      - bearerAuth: []
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UpdateEventResponse"
        "401":
          description: 인증 필요
    delete:
      tags:
      - Event
      summary: 이벤트 삭제
      description: 이벤트를 삭제합니다
      security:
      - bearerAuth: []
      parameters:
      - name: publicId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: 인증 필요
  /api/images:
    post:
      tags:
      - Image
      summary: 이미지 업로드
      description: 서버 저장소에 이미지를 업로드합니다.
      parameters:
      - name: prefix
        in: query
        description: 이미지를 저장할 상위 경로
        required: false
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - image
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: 이미지 업로드 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"
        "400":
          description: 잘못된 요청 (파일 누락/형식 오류 등)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 실패 (유효하지 않은 토큰)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events:
    post:
      tags:
      - Event
      summary: 이벤트 생성
      description: 새로운 이벤트를 생성합니다
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateEventResponse"
        "401":
          description: 인증 필요
  /api/events/{eventId}/registrations:
    get:
      tags:
      - Registration
      summary: 이벤트 신청 목록 조회
      description: 특정 이벤트에 속한 신청 목록을 조회합니다. 신청 상태(CONFIRMED/WAITLISTED/BANNED)와 신청
        시각을 포함해 반환합니다.
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 다음 페이지 시작 offset (없으면 0부터)
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetEventRegistrationsResponse"
    post:
      tags:
      - Registration
      summary: 이벤트 참여 신청
      description: "특정 이벤트에 신청합니다. 정원이 남아있으면 CONFIRMED로 등록되고, 정원이 찼으나 대기 명단이 허용된 경\
        우 WAITLISTED로 등록됩니다. 정원이 찼고 대기 명단이 비활성화된 경우 신청이 거절됩니다."
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistrationRequest"
        required: true
      responses:
        "200":
          description: 신청 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateRegistrationResponse"
        "409":
          description: "신청 불가: REGISTRATION_ALREADY_EXISTS, REGISTRATION_BLOCKED_HOST, EVENT_FULL"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: "유효하지 않은 요청: REGISTRATION_WRONG_NAME, REGISTRATION_WRONG_EMAIL, NOT_WITHIN_REGISTRATION_WINDOW"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "권한 없음: REGISTRATION_BLOCKED_BANNED"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "이벤트 없음: EVENT_NOT_FOUND"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/social:
    post:
      tags:
      - Auth
      summary: 소셜 로그인
      description: 소셜 로그인을 요청합니다.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLoginRequest"
        required: true
      responses:
        "200":
          description: 소셜 로그인 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "409":
          description: 이미 가입된 이메일
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/signup:
    post:
      tags:
      - Auth
      summary: 이메일 회원가입
      description: 새로운 사용자를 등록하고 인증 이메일을 발송합니다. 이메일 인증 후 가입이 완료됩니다.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "409":
          description: 이미 존재하는 email
        "204":
          description: 인증 이메일 발송 성공
        "400":
          description: 잘못된 요청 (유효하지 않은 email/password/name)
        "503":
          description: 이메일 서비스 장애
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 현재 JWT 토큰을 블랙리스트에 추가하여 로그아웃합니다
      responses:
        "204":
          description: 로그아웃 성공
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: 로그인
      description: email로 로그인하여 JWT 토큰을 발급받습니다
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: "로그인 성공, JWT 토큰 반환"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/auth/email-verification/{verificationCode}:
    post:
      tags:
      - Auth
      summary: 이메일 인증
      description: 이메일로 받은 인증 코드를 검증하고 회원가입을 완료합니다
      parameters:
      - name: verificationCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "400":
          description: 유효하지 않거나 만료된 인증 코드
        "200":
          description: "인증 성공, 유저 등록 완료"
  /api/users/me:
    get:
      tags:
      - User
      summary: 본인 정보 조회
      description: 로그인한 사용자의 정보를 조회합니다
      security:
      - bearerAuth: []
      responses:
        "401":
          description: 인증 실패 (유효하지 않은 토큰)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: 사용자 정보 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
    patch:
      tags:
      - User
      summary: 본인 정보 수정
      description: 로그인한 사용자의 정보를 수정합니다
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          description: 인증 필요
  /api/registrations/{registrationId}:
    get:
      tags:
      - Registration
      summary: 신청 단건 정보 요청
      description: 신청 단건의 정보를 반환합니다.
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetRegistrationResponse"
    delete:
      tags:
      - Registration
      summary: 신청 단건 취소
      description: 신청 단건 리소스를 취소합니다.
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRegistrationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeleteRegistrationResponse"
    patch:
      tags:
      - Registration
      summary: 신청 단건 상태 변경
      description: 신청 단건 리소스의 상태를 변경합니다. 사용자가 본인의 신청을 취소하는 경우와 관리자가 강제 취소/밴 처리하는 경우를
        로직 레벨에서 구분합니다.
      parameters:
      - name: registrationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRegistrationStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatchRegistrationResponse"
  /api/registrations/me:
    get:
      tags:
      - Registration
      summary: 내 이벤트 신청 목록 조회
      description: 로그인한 사용자의 이벤트 신청 목록을 조회합니다. 최신 신청 순으로 반환되며 page/size로 페이징합니다.
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GetMyRegistrationsResponse"
        "401":
          description: 인증 필요
  /api/events/me:
    get:
      tags:
      - Event
      summary: 내가 만든 이벤트 목록 조회 (무한 스크롤)
      description: 로그인된 사용자가 생성한 이벤트 목록을 무한 스크롤 방식(cursor)으로 조회합니다
      security:
      - bearerAuth: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 5
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MyEventsInfiniteResponse"
        "401":
          description: 인증 필요
components:
  schemas:
    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
          description: 이벤트 제목
          nullable: true
          example: 정기 모임
        description:
          type: string
          description: 이벤트 설명
          nullable: true
          example: 정기 모임입니다
        location:
          type: string
          description: 장소
          nullable: true
          example: 강의실 101
        startsAt:
          type: string
          description: 시작 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T18:00:00Z
        endsAt:
          type: string
          description: 종료 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T20:00:00Z
        capacity:
          type: integer
          description: 정원
          format: int32
          nullable: true
          example: 30
        waitlistEnabled:
          type: boolean
          description: 대기 명단 사용 여부
          nullable: true
          example: true
        registrationStartsAt:
          type: string
          description: 신청 시작 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T17:00:00Z
        registrationEndsAt:
          type: string
          description: 신청 마감 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T17:30:00Z
      description: 일정 수정 요청
    UpdateEventResponse:
      required:
      - registrationEndsAt
      - title
      - capacity
      - waitlistEnabled
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
          format: int32
          nullable: true
        waitlistEnabled:
          type: boolean
        registrationStartsAt:
          type: string
          format: date-time
          nullable: true
        registrationEndsAt:
          type: string
          format: date-time
    ImageUploadResponse:
      required:
      - key
      - url
      type: object
      properties:
        key:
          type: string
        url:
          type: string
    CreateEventRequest:
      required:
      - capacity
      - registrationEndsAt
      - title
      - waitlistEnabled
      type: object
      properties:
        title:
          type: string
          description: 이벤트 제목
          example: 정기 모임
        description:
          type: string
          description: 이벤트 설명
          nullable: true
          example: 정기 모임입니다
        location:
          type: string
          description: 장소
          nullable: true
          example: 강의실 101
        startsAt:
          type: string
          description: 시작 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T18:00:00Z
        endsAt:
          type: string
          description: 종료 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T20:00:00Z
        capacity:
          type: integer
          description: 정원
          format: int32
          example: 30
        waitlistEnabled:
          type: boolean
          description: 대기 명단 사용 여부
          example: true
        registrationStartsAt:
          type: string
          description: 신청 시작 시간 (ISO-8601). null인 경우 요청 시점으로 자동 설정됩니다.
          format: date-time
          nullable: true
          example: 2026-02-02T17:00:00Z
        registrationEndsAt:
          type: string
          description: 신청 마감 시간 (ISO-8601)
          format: date-time
          example: 2026-02-02T17:30:00Z
      description: 일정 생성 요청
    CreateEventResponse:
      required:
      - publicId
      type: object
      properties:
        publicId:
          type: string
    CreateRegistrationRequest:
      type: object
      properties:
        guestName:
          type: string
          description: 비회원 이름
          nullable: true
        guestEmail:
          type: string
          description: 비회원 이메일
          nullable: true
      description: 이벤트 신청 요청
    CreateRegistrationResponse:
      required:
      - registrationPublicId
      type: object
      properties:
        registrationPublicId:
          type: string
          description: 신청 id
      description: 이벤트 신청 응답
    SocialLoginRequest:
      required:
      - code
      - provider
      type: object
      properties:
        provider:
          type: string
          description: 소셜로그인 제공자
          example: GOOGLE
        code:
          type: string
          description: 인가 코드 (authorization code)
      description: 소셜 로그인 요청
    LoginResponse:
      required:
      - token
      type: object
      properties:
        token:
          type: string
    SignupRequest:
      required:
      - email
      - name
      - password
      type: object
      properties:
        email:
          type: string
          description: 사용자 이메일
          example: user@example.com
        name:
          type: string
          description: 사용자 이름
          example: 홍길동
        password:
          type: string
          description: 비밀번호
          example: password123
        profileImage:
          type: string
          description: 프로필 이미지 URL
          nullable: true
          example: https://cdn.example.com/profile.png
      description: 회원가입 요청
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
          description: 사용자 이메일
          example: user@example.com
        password:
          type: string
          description: 사용자 비밀번호
          example: mypassword
      description: 로그인 요청
    PatchMeRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
        profileImage:
          type: string
          nullable: true
    UserDto:
      required:
      - email
      - id
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        profileImage:
          type: string
          nullable: true
    UpdateRegistrationStatusRequest:
      type: object
      properties:
        status:
          type: string
          nullable: true
          enum:
          - HOST
          - CONFIRMED
          - WAITLISTED
          - BANNED
      description: 이벤트 신청 상태 변경 요청
    PatchRegistrationResponse:
      type: object
      properties:
        patchEmail:
          type: string
          nullable: true
      description: 이벤트 신청 상태 변경
    GetRegistrationResponse:
      required:
      - guestName
      - registrationPublicId
      - reservationEmail
      - status
      - waitlistPosition
      type: object
      properties:
        status:
          type: string
          enum:
          - HOST
          - CONFIRMED
          - WAITLISTED
          - BANNED
        guestName:
          type: string
        waitlistPosition:
          type: integer
          format: int32
        registrationPublicId:
          type: string
        reservationEmail:
          type: string
      description: 이벤트 신청 정보 요청 응답
    GetMyRegistrationsResponse:
      required:
      - registrations
      type: object
      properties:
        registrations:
          type: array
          description: 신청 목록
          items:
            $ref: "#/components/schemas/MyRegistrationItem"
      description: 내 이벤트 신청 목록 응답
    MyRegistrationItem:
      required:
      - publicId
      - confirmedCount
