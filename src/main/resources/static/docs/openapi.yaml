    CapabilitiesInfo:
      required:
      - apply
      - cancel
      - shareLink
      - wait
      type: object
      properties:
        shareLink:
          type: boolean
          description: 공유 링크 가능 여부
          example: false
        apply:
          type: boolean
          description: 참여 신청 가능 여부(확정 자리 신청)
          example: false
        wait:
          type: boolean
          description: 대기 신청 가능 여부(정원 찼을 때)
          example: false
        cancel:
          type: boolean
          description: 신청 취소 가능 여부
          example: true
      description: 가능한 동작 블록
    CreatorInfo:
      required:
      - email
      - name
      type: object
      properties:
        name:
          type: string
          description: 이름
          example: 홍길동
        email:
          type: string
          description: 이메일
          example: user@example.com
        profileImage:
          type: string
          description: 프로필 이미지
          nullable: true
          example: https://example.com/profile.png
      description: 생성자 정보 블록
    EventDetailResponse:
      required:
      - capabilities
      - creator
      - event
      - guestsPreview
      - viewer
      type: object
      properties:
        event:
          $ref: "#/components/schemas/EventInfo"
        creator:
          $ref: "#/components/schemas/CreatorInfo"
        viewer:
          $ref: "#/components/schemas/ViewerInfo"
        capabilities:
          $ref: "#/components/schemas/CapabilitiesInfo"
