          type: array
          description: 참여자 미리보기 목록
          items:
            $ref: "#/components/schemas/GuestPreview"
      description: 일정 상세 조회 응답
    EventInfo:
      required:
      - publicId
      - registrationEndsAt
      - title
      - confirmedCount
      - waitlistCount
      type: object
      properties:
        publicId:
          type: string
          description: 이벤트 publicId
          example: dj8sadj10djnkas
        title:
          type: string
          description: 이벤트 제목
          example: 제2회 기획 세미나
        description:
          type: string
          description: 이벤트 설명
          nullable: true
          example: 일정 상세 설명...
        location:
          type: string
          description: 장소
          nullable: true
          example: 서울대
        startsAt:
          type: string
          description: 시작 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T18:00:00Z
        endsAt:
          type: string
          description: 종료 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T20:00:00Z
        capacity:
          type: integer
          description: 정원
          format: int32
          nullable: true
          example: 10
        confirmedCount:
          type: integer
          description: 참여 확정 신청자 수
          format: int32
          example: 8
        waitlistCount:
          type: integer
          description: 대기자 수
          format: int32
          example: 8
        registrationStartsAt:
          type: string
          description: 신청 시작 시간 (ISO-8601)
          format: date-time
          nullable: true
          example: 2026-02-02T17:00:00Z
        registrationEndsAt:
          type: string
          description: 신청 마감 시간 (ISO-8601)
          format: date-time
          example: 2026-02-02T17:00:00Z
      description: 이벤트 정보 블록
    GuestPreview:
      required:
      - name
      type: object
      properties:
        id:
          type: integer
          description: 참여자 ID (비회원이면 null)
          format: int64
          nullable: true
          example: 1
        name:
          type: string
          description: 참여자 이름
          example: 홍길동
        profileImage:
          type: string
          description: 프로필 이미지 URL
          nullable: true
          example: https://example.com/profile.png
      description: 참여자 미리보기 정보
    ViewerInfo:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          description: 이벤트 조회자(Viewer)의 상태
          example: WAITLISTED
          enum:
          - HOST
          - CONFIRMED
          - WAITLISTED
          - BANNED
          - NONE
        name:
          type: string
          description: viewer 이름 (비회원이면 null)
          nullable: true
          example: 홍길동
        waitlistPosition:
          type: integer
          description: "대기 순번 (WAITLISTED일 때만 숫자, 아니면 null)"
          format: int32
          nullable: true
          example: 3
        registrationPublicId:
          type: string
          description: "registrationPublicId (게스트면 값, 아니면 null)"
          nullable: true
          example: "1"
        reservationEmail:
          type: string
          description: "예약 이메일(게스트면 guestEmail, 로그인 유저면 user email 등 정책에 따름)"
          nullable: true
          example: skdfsj@gmaldkl
      description: 조회자(viewer) 정보 블록
    EventRegistrationItem:
      required:
      - createdAt
      - name
      - registrationId
      - status
      type: object
      properties:
        registrationId:
          type: string
          description: 신청 공개 ID
        name:
          type: string
          description: 이름
        email:
          type: string
          description: 이메일 (관리자 요청 시 노출)
          nullable: true
        profileImage:
          type: string
          description: 프로필 이미지 URL
          nullable: true
        createdAt:
          type: string
          description: 신청 일시
          format: date-time
        status:
          type: string
          description: 신청 상태
          enum:
          - HOST
          - CONFIRMED
          - WAITLISTED
          - BANNED
        waitingNum:
          type: integer
          description: 대기 순번 (status가 WAITLISTED일 때만 아니면 null)
          format: int32
          nullable: true
      description: 신청자 정보
    GetEventRegistrationsResponse:
      required:
      - hasNext
